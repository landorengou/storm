<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>現在の時刻</title>
  <style>
    :root {
      color-scheme: dark;
      --text: #edf2ff;
      --muted: #b8c3d9;
      --accent: #7dd3fc;
      --accent-2: #a78bfa;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: grid;
      place-items: center;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, #a78bfa40, transparent 32%),
        radial-gradient(circle at bottom right, #7dd3fc40, transparent 35%),
        linear-gradient(135deg, #0f172a, #111827);
    }

    .clock-card {
      width: min(100%, 620px);
      padding: 32px 24px;
      border: 1px solid #ffffff18;
      border-radius: 28px;
      background: #0f172ab8;
      box-shadow: 0 30px 80px #0007;
      text-align: center;
      backdrop-filter: blur(14px);
    }

    .label {
      margin-bottom: 20px;
      color: var(--muted);
      font-size: .78rem;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 18px #7dd3fcaa;
      animation: pulse 1.6s ease-in-out infinite;
    }

    .time {
      font-size: clamp(3.2rem, 11vw, 7rem);
      font-weight: 700;
      letter-spacing: -.06em;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 18px #7dd3fc59;
    }

    .date {
      margin-top: 16px;
      color: var(--muted);
      font-size: clamp(1rem, 3vw, 1.35rem);
      letter-spacing: .06em;
    }

    .timezone {
      margin-top: 12px;
      color: #ffffffb3;
      font-size: .82rem;
    }

    .format-switch {
      display: inline-flex;
      gap: 5px;
      margin-top: 26px;
      padding: 5px;
      border: 1px solid #ffffff1a;
      border-radius: 12px;
      background: #080d18a8;
    }

    .format-switch button {
      padding: 9px 14px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
    }

    .format-switch button[aria-pressed="true"] {
      background: #7c6cf0;
      color: white;
    }

    .format-switch button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    @keyframes pulse {
      50% { transform: scale(1.2); opacity: .7; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="clock-card">
    <div class="label"><span class="dot" aria-hidden="true"></span>現在の時刻</div>
    <div class="time" id="time" aria-live="off">--:--:--</div>
    <div class="date" id="date">----</div>
    <div class="timezone" id="timezone"></div>

    <div class="format-switch" role="group" aria-label="時刻の表示形式">
      <button type="button" id="format24" aria-pressed="true">24時間</button>
      <button type="button" id="format12" aria-pressed="false">12時間</button>
    </div>
  </main>

  <script>
    const timeElement = document.querySelector("#time");
    const dateElement = document.querySelector("#date");
    const timezoneElement = document.querySelector("#timezone");
    const button24 = document.querySelector("#format24");
    const button12 = document.querySelector("#format12");

    let use24Hour = localStorage.getItem("clock-format") !== "12";

    function updateClock() {
      const now = new Date();

      timeElement.textContent = new Intl.DateTimeFormat("ja-JP", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: !use24Hour
      }).format(now);

      dateElement.textContent = new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long"
      }).format(now);

      timezoneElement.textContent =
        Intl.DateTimeFormat().resolvedOptions().timeZone || "ローカル時間";

      button24.setAttribute("aria-pressed", String(use24Hour));
      button12.setAttribute("aria-pressed", String(!use24Hour));
    }

    button24.addEventListener("click", () => {
      use24Hour = true;
      localStorage.setItem("clock-format", "24");
      updateClock();
    });

    button12.addEventListener("click", () => {
      use24Hour = false;
      localStorage.setItem("clock-format", "12");
      updateClock();
    });

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
