<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アナログ時計</title>
  <style>
    :root {
      color-scheme: dark;
      --text: #edf2ff;
      --muted: #bdc8df;
      --accent: #7dd3fc;
      --purple: #a78bfa;
      --pink: #f9a8d4;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, #a78bfa38, transparent 26%),
        radial-gradient(circle at 80% 30%, #7dd3fc30, transparent 28%),
        radial-gradient(circle at 50% 85%, #f9a8d420, transparent 32%),
        linear-gradient(135deg, #070d19, #111827 55%, #0a1221);
    }

    .orb {
      position: fixed;
      z-index: 0;
      width: 360px;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(35px);
      opacity: .7;
      pointer-events: none;
      animation: drift 18s ease-in-out infinite alternate;
    }

    .orb-one {
      top: -110px;
      left: -100px;
      background: #7dd3fc2c;
    }

    .orb-two {
      right: -120px;
      bottom: -100px;
      background: #a78bfa30;
      animation-delay: -7s;
    }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(35px, 30px) scale(1.12); }
    }

    .clock-card {
      position: relative;
      z-index: 1;
      width: min(100%, 520px);
      padding: 30px 24px;
      border: 1px solid #ffffff1a;
      border-radius: 28px;
      background: #0c1424b8;
      box-shadow: 0 24px 70px #0007, inset 0 1px #ffffff0b;
      backdrop-filter: blur(18px);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: .78rem;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .clock {
      display: block;
      width: min(72vw, 320px);
      margin: 0 auto;
      overflow: visible;
      filter: drop-shadow(0 10px 24px #0005);
    }

    .face {
      fill: #111b2c;
      stroke: #ffffff25;
      stroke-width: 1.5;
    }

    .face-inner {
      fill: none;
      stroke: #ffffff0c;
      stroke-width: 1;
    }

    .tick {
      stroke: #cbd5e1;
      stroke-width: 1.5;
      stroke-linecap: round;
      opacity: .65;
    }

    .tick.major {
      stroke: var(--accent);
      stroke-width: 2.6;
      opacity: .95;
    }

    .number {
      fill: var(--text);
      font-size: 11px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .hand {
      stroke-linecap: round;
      transform-origin: 100px 100px;
    }

    .hour-hand {
      stroke: #f4f6fb;
      stroke-width: 5;
    }

    .minute-hand {
      stroke: var(--accent);
      stroke-width: 3.2;
    }

    .second-hand {
      stroke: var(--pink);
      stroke-width: 1.5;
    }

    .center-cap { fill: var(--pink); }

    .digital-time {
      margin-top: 20px;
      font-size: clamp(2rem, 9vw, 3.2rem);
      font-weight: 650;
      letter-spacing: -.04em;
      font-variant-numeric: tabular-nums;
    }

    .date {
      margin-top: 8px;
      color: var(--muted);
      font-size: 1rem;
    }

    .timezone {
      margin-top: 8px;
      color: #bdc8dfb8;
      font-size: .8rem;
    }

    .format-switch {
      display: inline-flex;
      gap: 5px;
      margin-top: 22px;
      padding: 5px;
      border: 1px solid #ffffff18;
      border-radius: 12px;
      background: #070d19aa;
    }

    .format-switch button {
      padding: 9px 14px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
    }

    .format-switch button[aria-pressed="true"] {
      background: #7c6cf0;
      color: white;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="orb orb-one" aria-hidden="true"></div>
  <div class="orb orb-two" aria-hidden="true"></div>

  <main class="clock-card">
    <p class="eyebrow">現在の時刻</p>

    <svg class="clock" viewBox="0 0 200 200" role="img" aria-label="現在時刻を示すアナログ時計">
      <circle class="face" cx="100" cy="100" r="95" />
      <circle class="face-inner" cx="100" cy="100" r="79" />
      <g id="ticks"></g>
      <g id="numbers"></g>

      <line class="hand hour-hand" id="hour-hand" x1="100" y1="105" x2="100" y2="59" />
      <line class="hand minute-hand" id="minute-hand" x1="100" y1="105" x2="100" y2="34" />
      <line class="hand second-hand" id="second-hand" x1="100" y1="112" x2="100" y2="27" />
      <circle class="center-cap" cx="100" cy="100" r="4" />
    </svg>

    <div class="digital-time" id="digital-time" aria-live="off">--:--:--</div>
    <div class="date" id="date">----</div>
    <div class="timezone" id="timezone"></div>

    <div class="format-switch" role="group" aria-label="デジタル時刻の表示形式">
      <button type="button" id="format24" aria-pressed="true">24時間</button>
      <button type="button" id="format12" aria-pressed="false">12時間</button>
    </div>
  </main>

  <script>
    const svgNS = "http://www.w3.org/2000/svg";
    const ticks = document.querySelector("#ticks");
    const numbers = document.querySelector("#numbers");

    // 時計の目盛りと数字を作成
    for (let i = 0; i < 60; i++) {
      const line = document.createElementNS(svgNS, "line");
      line.setAttribute("x1", "100");
      line.setAttribute("y1", i % 5 === 0 ? "11" : "15");
      line.setAttribute("x2", "100");
      line.setAttribute("y2", i % 5 === 0 ? "21" : "19");
      line.setAttribute("class", i % 5 === 0 ? "tick major" : "tick");
      line.setAttribute("transform", `rotate(${i * 6} 100 100)`);
      ticks.appendChild(line);
    }

    for (let hour = 1; hour <= 12; hour++) {
      const angle = (hour * 30 - 90) * Math.PI / 180;
      const text = document.createElementNS(svgNS, "text");
      text.setAttribute("x", String(100 + Math.cos(angle) * 65));
      text.setAttribute("y", String(100 + Math.sin(angle) * 65));
      text.setAttribute("class", "number");
      text.textContent = hour;
      numbers.appendChild(text);
    }

    const digitalTime = document.querySelector("#digital-time");
    const dateElement = document.querySelector("#date");
    const timezoneElement = document.querySelector("#timezone");
    const button24 = document.querySelector("#format24");
    const button12 = document.querySelector("#format12");

    let use24Hour = localStorage.getItem("clock-format") !== "12";

    function updateClock() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();
      const milliseconds = now.getMilliseconds();

      // 時計の針を更新
      const hourAngle = ((hours % 12) + minutes / 60) * 30;
      const minuteAngle = (minutes + seconds / 60) * 6;
      const secondAngle = (seconds + milliseconds / 1000) * 6;

      document.querySelector("#hour-hand")
        .setAttribute("transform", `rotate(${hourAngle} 100 100)`);
      document.querySelector("#minute-hand")
        .setAttribute("transform", `rotate(${minuteAngle} 100 100)`);
      document.querySelector("#second-hand")
        .setAttribute("transform", `rotate(${secondAngle} 100 100)`);

      digitalTime.textContent = new Intl.DateTimeFormat("ja-JP", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: !use24Hour
      }).format(now);

      dateElement.textContent = new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long"
      }).format(now);

      timezoneElement.textContent =
        Intl.DateTimeFormat().resolvedOptions().timeZone || "ローカル時間";

      button24.setAttribute("aria-pressed", String(use24Hour));
      button12.setAttribute("aria-pressed", String(!use24Hour));
    }

    button24.addEventListener("click", () => {
      use24Hour = true;
      localStorage.setItem("clock-format", "24");
      updateClock();
    });

    button12.addEventListener("click", () => {
      use24Hour = false;
      localStorage.setItem("clock-format", "12");
      updateClock();
    });

    updateClock();
    setInterval(updateClock, 50);
  </script>
</body>
</html>
