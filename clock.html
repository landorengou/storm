<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Clock</title>
  <style>
    :root {
      --bg1: #091120;
      --bg2: #111827;
      --panel: rgba(10, 18, 30, 0.46);
      --text: #edf2ff;
      --muted: #c5d0ea;
      --accent: #7dd3fc;
      --accent-2: #a78bfa;
      --accent-3: #f9a8d4;
      --button-active: rgba(124, 108, 240, 0.95);
      --button-inactive: rgba(255, 255, 255, 0.05);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
    }

    body {
      position: relative;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 15% 20%, rgba(167,139,250,0.38), transparent 25%),
        radial-gradient(circle at 75% 30%, rgba(125,211,252,0.34), transparent 28%),
        radial-gradient(circle at 50% 80%, rgba(249,168,212,0.22), transparent 32%),
        linear-gradient(135deg, #070d19, #111827 45%, #0a1221);
    }

    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(28px);
      opacity: 0.8;
      animation: floatOrb 18s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .orb-1 {
      width: 420px;
      height: 420px;
      left: -120px;
      top: 10%;
      background: rgba(125, 211, 252, 0.17);
      animation-delay: 0s;
    }

    .orb-2 {
      width: 500px;
      height: 500px;
      right: -150px;
      bottom: -40px;
      background: rgba(167, 139, 250, 0.18);
      animation-delay: 3s;
    }

    .orb-3 {
      width: 380px;
      height: 380px;
      left: 28%;
      bottom: -120px;
      background: rgba(249, 168, 212, 0.12);
      animation-delay: 6s;
    }

    @keyframes floatOrb {
      0% {
        transform: translate3d(0, 0, 0) scale(1);
      }
      50% {
        transform: translate3d(28px, -40px, 0) scale(1.08);
      }
      100% {
        transform: translate3d(-18px, 22px, 0) scale(0.96);
      }
    }

    .clock-card {
      position: relative;
      z-index: 1;
      width: min(92vw, 680px);
      padding: 38px 28px 30px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 30px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.4),
        inset 0 0 0 1px rgba(255,255,255,0.04);
      text-align: center;
    }

    .label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      color: var(--muted);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 0.76rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 18px rgba(125, 211, 252, 0.8);
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.7; }
    }

    .time {
      font-size: clamp(3.2rem, 11vw, 7.3rem);
      line-height: 1;
      letter-spacing: -0.065em;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 28px rgba(125, 211, 252, 0.28);
    }

    .date {
      margin-top: 18px;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.5rem);
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
    }

    .timezone {
      margin-top: 12px;
      color: rgba(255,255,255,0.7);
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .format-switch {
      display: inline-flex;
      gap: 6px;
      margin-top: 26px;
      padding: 6px;
      border-radius: 14px;
      background: rgba(7, 13, 22, 0.7);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .format-switch button {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      transition: 0.2s ease;
    }

    .format-switch button[aria-pressed="true"] {
      background: var(--button-active);
      color: white;
      box-shadow: 0 4px 18px rgba(124, 108, 240, 0.5);
    }

    .format-switch button:hover {
      background: rgba(255,255,255,0.06);
    }

    .format-switch button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (max-width: 480px) {
      .clock-card {
        padding: 28px 20px 24px;
      }

      .label {
        letter-spacing: 0.12em;
        font-size: 0.67rem;
      }

      .date {
        letter-spacing: 0.04em;
      }

      .format-switch {
        width: 100%;
        justify-content: center;
      }

      .format-switch button {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="bg-orb orb-1" aria-hidden="true"></div>
  <div class="bg-orb orb-2" aria-hidden="true"></div>
  <div class="bg-orb orb-3" aria-hidden="true"></div>

  <main class="clock-card">
    <div class="label"><span class="dot" aria-hidden="true"></span>Current Time</div>

    <div class="time" id="time" aria-live="polite">--:--:--</div>
    <div class="date" id="date">----</div>
    <div class="timezone" id="timezone">Local Time</div>

    <div class="format-switch" role="group" aria-label="時刻の表示形式">
      <button type="button" id="format24" aria-pressed="true">24時間</button>
      <button type="button" id="format12" aria-pressed="false">12時間</button>
    </div>
  </main>

  <script>
    const timeEl = document.getElementById("time");
    const dateEl = document.getElementById("date");
    const tzEl = document.getElementById("timezone");
    const btn24 = document.getElementById("format24");
    const btn12 = document.getElementById("format12");

    let use24Hour = localStorage.getItem("animated-clock-format") !== "12";

    function formatTime(now) {
      return new Intl.DateTimeFormat("ja-JP", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: !use24Hour
      }).format(now);
    }

    function updateClock() {
      const now = new Date();

      timeEl.textContent = formatTime(now);

      dateEl.textContent = new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long"
      }).format(now);

      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Local Time";
      tzEl.textContent = tz;

      btn24.setAttribute("aria-pressed", String(use24Hour));
      btn12.setAttribute("aria-pressed", String(!use24Hour));
    }

    btn24.addEventListener("click", () => {
      use24Hour = true;
      localStorage.setItem("animated-clock-format", "24");
      updateClock();
    });

    btn12.addEventListener("click", () => {
      use24Hour = false;
      localStorage.setItem("animated-clock-format", "12");
      updateClock();
    });

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
