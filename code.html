<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>サイト作成ツール</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #eef2f7;
      font-family: sans-serif;
    }
    .editor, .preview {
      min-width: 0;
      padding: 16px;
    }
    .editor { border-right: 2px solid #d9dfea; }
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      background: #4f46e5;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    textarea {
      width: 100%;
      height: calc(100% - 52px);
      resize: none;
      border: 1px solid #bbc3d1;
      border-radius: 8px;
      padding: 14px;
      font: 14px monospace;
      background: #172033;
      color: #dbeafe;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 1px solid #bbc3d1;
      border-radius: 8px;
      background: white;
    }
  </style>
</head>
<body>
  <section class="editor">
    <div class="toolbar">
      <button id="previewButton">プレビュー更新</button>
      <button id="downloadButton">ダウンロード</button>
    </div>
    <textarea id="code" spellcheck="false"></textarea>
  </section>

  <section class="preview">
    <iframe id="screen" title="プレビュー"></iframe>
  </section>

  <script>
    const code = document.getElementダEMent?ById('code');
    code.value = `<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自作サイト</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #74ebd5, #acb6e5);
      font-family: sans-serif;
    }
    h1 { color: #4f46e5; }
  </style>
</head>
<body>
  <h1>こんにちは！</h1>
</body>
</html>`;

    function updatePreview() {
      document.getElementById('screen').srcdoc = code.value;
    }

    document.getElementById('previewButton').onclick = updatePreview;

    document.getElementById('downloadButton').onclick = () => {
      const blob = new Blob([code.value], {
        type: 'text/html;charset=utf-8'
      });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'index.html';
      link.click();
      URL.revokeObjectURL(url);
    };

    updatePreview();
  </script>
</body>
</html>
