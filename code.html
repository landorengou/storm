<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超・万能ダッシュボード</title>
<style>
  :root {
    --bg: #f0f2f5; --card: #ffffff; --text: #333333; --border: #dddddd; --accent: #3498db; --accent-hover: #2980b9; --sub: #7f8c8d;
  }
  body.dark {
    --bg: #18191a; --card: #242526; --text: #e4e6eb; --border: #3a3b3c; --accent: #4599ff; --accent-hover: #2d88ff; --sub: #b0b3b8;
  }
  body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
  header { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 15px; }
  h1 { margin: 0; font-size: 1.4em; }
  .theme-btn { width: auto; padding: 8px 14px; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
  .card { background: var(--card); padding: 18px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); border: 1px solid var(--border); }
  h2 { margin-top: 0; font-size: 1.1em; border-bottom: 2px solid var(--accent); padding-bottom: 5px; }
  textarea, input, select { width: 100%; box-sizing: border-box; padding: 8px; margin: 5px 0; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); color: var(--text); font-size: 15px; }
  button.action { background: var(--accent); color: #fff; border: none; padding: 10px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 5px; font-size: 15px; }
  button.action:active { opacity: 0.8; }
  .result { margin-top: 10px; font-weight: bold; color: #e74c3c; font-size: 1.05em; }
  .todo-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .todo-item span.done { text-decoration: line-through; color: var(--sub); }
  .del-btn { background: #e74c3c; color: #fff; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
  .timer-display { font-size: 2.4em; text-align: center; font-weight: bold; margin: 10px 0; }
  .btn-group { display: flex; gap: 6px; }
  #qrImg { display: block; margin: 10px auto 0; max-width: 150px; }
</style>
</head>
<body>

<header>
  <h1>🚀 万能ダッシュボード</h1>
  <button type="button" class="theme-btn" id="btnTheme">🌓 テーマ切替</button>
</header>

<div class="grid">
  <!-- 1. ToDoリスト -->
  <div class="card">
    <h2>✅ ToDoリスト</h2>
    <div style="display:flex; gap:5px;">
      <input type="text" id="todoInput" placeholder="やることを入力...">
      <button type="button" class="action" id="btnAddTodo" style="width:70px; margin:5px 0;">追加</button>
    </div>
    <div id="todoList"></div>
  </div>

  <!-- 2. 集中タイマー -->
  <div class="card">
    <h2>⏱️ 集中タイマー（25分）</h2>
    <div class="timer-display" id="timerDisplay">25:00</div>
    <div class="btn-group">
      <button type="button" class="action" id="btnStart">開始</button>
      <button type="button" class="action" id="btnPause" style="background:#f39c12;">停止</button>
      <button type="button" class="action" id="btnReset" style="background:#95a5a6;">戻す</button>
    </div>
  </div>

  <!-- 3. メモ帳 -->
  <div class="card">
    <h2>📌 メモ帳</h2>
    <textarea id="memoArea" rows="5" placeholder="ここにメモを入力..."></textarea>
    <button type="button" class="action" id="btnCopyMemo" style="background:#2ecc71;">メモをコピー</button>
  </div>

  <!-- 4. 文字数カウンター -->
  <div class="card">
    <h2>📝 文字数カウンター</h2>
    <textarea id="textInput" rows="4" placeholder="ここにテキストを入力..."></textarea>
    <div class="result" id="charCount">0文字（空白除く: 0文字 / 0行）</div>
  </div>

  <!-- 5. 割引・税込計算機 -->
  <div class="card">
    <h2>🏷️ 割引・税込計算機</h2>
    <input type="number" id="origPrice" placeholder="元の価格（円）">
    <div style="display:flex; gap:5px;">
      <input type="number" id="discRate" placeholder="割引率（% OFF）">
      <select id="taxRate">
        <option value="1">税込価格で入力</option>
        <option value="1.1">+ 消費税 10%</option>
        <option value="1.08">+ 軽減税率 8%</option>
      </select>
    </div>
    <div class="result" id="discResult">支払額: 0円（0円お得）</div>
  </div>

  <!-- 6. 割り勘計算機 -->
  <div class="card">
    <h2>💴 割り勘計算機</h2>
    <input type="number" id="totalAmount" placeholder="合計金額（円）">
    <input type="number" id="numPeople" placeholder="人数（人）">
    <div class="result" id="splitResult">1人あたり: 0円</div>
  </div>

  <!-- 7. QRコード生成 -->
  <div class="card">
    <h2>📱 QRコード作成</h2>
    <input type="text" id="qrText" placeholder="URLやテキストを入力...">
    <button type="button" class="action" id="btnMakeQR">QRコード生成</button>
    <img id="qrImg" src="" alt="" style="display:none;">
  </div>

  <!-- 8. パスワード生成 -->
  <div class="card">
    <h2>🔑 パスワード生成</h2>
    <input type="number" id="pwLength" value="14" min="4" max="64" placeholder="文字数">
    <button type="button" class="action" id="btnGenPw">生成する</button>
    <input type="text" id="pwOutput" readonly placeholder="ここに生成されます">
    <button type="button" class="action" id="btnCopyPw" style="background:#2ecc71;">コピーする</button>
  </div>

  <!-- 9. 西暦・和暦変換 -->
  <div class="card">
    <h2>📅 西暦・和暦・年齢早見</h2>
    <input type="number" id="birthYear" placeholder="生まれ年（例: 1995）">
    <div class="result" id="yearResult">和暦と年齢を表示します</div>
  </div>

  <!-- 10. ルーレット -->
  <div class="card">
    <h2>🎯 迷った時のルーレット</h2>
    <textarea id="rouletteItems" rows="3" placeholder="選択肢を改行で入力&#10;ラーメン&#10;カレー&#10;寿司"></textarea>
    <button type="button" class="action" id="btnSpin">抽選する！</button>
    <div class="result" id="rouletteResult" style="font-size:1.2em; text-align:center;"></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // 安全なストレージ操作（一部ブラウザの制限対策）
  function saveStore(key, val) {
    try { localStorage.setItem(key, val); } catch (e) {}
  }
  function loadStore(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }

  // コピー機能
  function copyToClipboard(text) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => alert('コピーしました！')).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text) {
    const tmp = document.createElement('textarea');
    tmp.value = text;
    document.body.appendChild(tmp);
    tmp.select();
    document.execCommand('copy');
    document.body.removeChild(tmp);
    alert('コピーしました！');
  }

  // テーマ切替
  if (loadStore('theme') === 'dark') document.body.classList.add('dark');
  document.getElementById('btnTheme').addEventListener('click', function() {
    document.body.classList.toggle('dark');
    saveStore('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
  });

  // 1. ToDoリスト
  let todos = [];
  try { todos = JSON.parse(loadStore('myTodos') || '[]'); } catch (e) {}
  function renderTodos() {
    const list = document.getElementById('todoList');
    list.innerHTML = '';
    todos.forEach((t, i) => {
      const div = document.createElement('div');
      div.className = 'todo-item';
      const span = document.createElement('span');
      span.className = t.done ? 'done' : '';
      span.style.cursor = 'pointer';
      span.textContent = (t.done ? '☑️ ' : '⬜ ') + t.text;
      span.onclick = () => { todos[i].done = !todos[i].done; renderTodos(); };

      const del = document.createElement('button');
      del.className = 'del-btn';
      del.textContent = '削除';
      del.onclick = () => { todos.splice(i, 1); renderTodos(); };

      div.appendChild(span);
      div.appendChild(del);
      list.appendChild(div);
    });
    saveStore('myTodos', JSON.stringify(todos));
  }
  document.getElementById('btnAddTodo').addEventListener('click', function() {
    const inp = document.getElementById('todoInput');
    if (inp.value.trim()) {
      todos.push({ text: inp.value.trim(), done: false });
      inp.value = '';
      renderTodos();
    }
  });
  renderTodos();

  // 2. タイマー
  let timeLeft = 25 * 60, timerId = null;
  function updateTimer() {
    const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
    const s = String(timeLeft % 60).padStart(2, '0');
    document.getElementById('timerDisplay').textContent = m + ':' + s;
  }
  document.getElementById('btnStart').addEventListener('click', function() {
    if (timerId) return;
    timerId = setInterval(() => {
      if (timeLeft > 0) { timeLeft--; updateTimer(); }
      else { clearInterval(timerId); timerId = null; alert('25分経過しました！'); }
    }, 1000);
  });
  document.getElementById('btnPause').addEventListener('click', function() {
    clearInterval(timerId); timerId = null;
  });
  document.getElementById('btnReset').addEventListener('click', function() {
    clearInterval(timerId); timerId = null; timeLeft = 25 * 60; updateTimer();
  });

  // 3. メモ帳
  const memoArea = document.getElementById('memoArea');
  memoArea.value = loadStore('myQuickMemo') || '';
  memoArea.addEventListener('input', () => saveStore('myQuickMemo', memoArea.value));
  document.getElementById('btnCopyMemo').addEventListener('click', () => copyToClipboard(memoArea.value));

  // 4. 文字数カウント
  document.getElementById('textInput').addEventListener('input', function() {
    const t = this.value;
    const noSpace = t.replace(/\s+/g, '');
    const lines = t ? t.split(/\r\n|\r|\n/).length : 0;
    document.getElementById('charCount').textContent = `${t.length}文字（空白除く: ${noSpace.length}文字 / ${lines}行）`;
  });

  // 5. 割引計算
  function calcDiscount() {
    const p = Number(document.getElementById('origPrice').value);
    const d = Number(document.getElementById('discRate').value);
    const tax = Number(document.getElementById('taxRate').value);
    if (p > 0) {
      const finalPrice = Math.floor(p * (1 - d / 100) * tax);
      const saved = Math.floor(p * tax) - finalPrice;
document.getElementById('discResult').textContent = 支払額: ${finalPrice.toLocaleString()}円（${saved.toLocaleString()}円お得）;
} else {
document.getElementById('discResult').textContent = '支払額: 0円（0円お得）';
}
}
document.getElementById('origPrice').addEventListener('input', calcDiscount);
document.getElementById('discRate').addEventListener('input', calcDiscount);
document.getElementById('taxRate').addEventListener('change', calcDiscount);
// 6. 割り勘計算
function calcSplit() {
const total = Number(document.getElementById('totalAmount').value);
const people = Number(document.getElementById('numPeople').value);
if (total > 0 && people > 0) {
document.getElementById('splitResult').textContent = 1人あたり: ${Math.ceil(total / people).toLocaleString()}円（切上）;
} else {
document.getElementById('splitResult').textContent = '1人あたり: 0円';
}
}
document.getElementById('totalAmount').addEventListener('input', calcSplit);
document.getElementById('numPeople').addEventListener('input', calcSplit);
// 7. QRコード
document.getElementById('btnMakeQR').addEventListener('click', function() {
const txt = encodeURIComponent(document.getElementById('qrText').value);
if (!txt) return;
const img = document.getElementById('qrImg');
img.src = 'qrserver.com' + txt;
img.style.display = 'block';
});
// 8. パスワード生成
document.getElementById('btnGenPw').addEventListener('click', function() {
const len = Number(document.getElementById('pwLength').value) || 14;
const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*';
let pw = '';
for (let i = 0; i < len; i++) pw += chars.charAt(Math.floor(Math.random() * chars.length));
document.getElementById('pwOutput').value = pw;
});
document.getElementById('btnCopyPw').addEventListener('click', function() {
const pw = document.getElementById('pwOutput').value;
if (pw) copyToClipboard(pw);
});
// 9. 西暦・和暦変換
document.getElementById('birthYear').addEventListener('input', function() {
const y = Number(this.value);
if (y < 1868) { document.getElementById('yearResult').textContent = '和暦と年齢を表示します'; return; }
const age = new Date().getFullYear() - y;
let wareki = '';
if (y >= 2019) wareki = '令和' + (y - 2018 === 1 ? '元' : y - 2018) + '年';
else if (y >= 1989) wareki = '平成' + (y - 1988 === 1 ? '元' : y - 1988) + '年';
else if (y >= 1926) wareki = '昭和' + (y - 1925 === 1 ? '元' : y - 1925) + '年';
else wareki = '大正/明治';
document.getElementById('yearResult').textContent = ${wareki}生まれ ／ 今年 ${age}歳（誕生日前は${age - 1}歳）;
});
// 10. ルーレット
document.getElementById('btnSpin').addEventListener('click', function() {
const items = document.getElementById('rouletteItems').value.split('\n').map(s => s.trim()).filter(Boolean);
if (items.length === 0) return;
const picked = items[Math.floor(Math.random() * items.length)];
document.getElementById('rouletteResult').textContent = 🎉「${picked}」に決定！;
});
});
