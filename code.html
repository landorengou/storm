<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ようこそ！</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #8ec5fc, #e0c3fc);
      font-family: sans-serif;
    }

    .card {
      width: min(80%, 500px);
      padding: 40px;
      border-radius: 20px;
      background: white;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 24px;
      background: #6366f1;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>こんにちは！</h1>
    <p>このページはブラウザだけで動きます。</p>
    <button onclick="alert('ようこそ！')">クリック</button>
  </div>
</body>
</html>
