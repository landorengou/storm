<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timer & Stopwatch</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10131d;
      --panel: #191e2b;
      --muted: #9ba5ba;
      --text: #f4f6fb;
      --accent: #8b7cff;
      --accent-light: #b2a8ff;
      --border: #2a3040;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 0%, #272345 0%, transparent 52%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .app { width: min(100%, 520px); }

    header { margin-bottom: 24px; text-align: center; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent-light);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(1.7rem, 6vw, 2.2rem); }
    .subtitle { margin: 8px 0 0; color: var(--muted); font-size: .95rem; }

    .panel {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      box-shadow: 0 24px 80px #0005;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin: 16px;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #111520;
    }

    .tab, button {
      border: 0;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    .tab {
      padding: 12px;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-weight: 650;
    }

    .tab[aria-selected="true"] {
      background: #292541;
      color: #d7d1ff;
    }

    .view { padding: 20px 24px 28px; }
    .view[hidden] { display: none; }

    .readout {
      margin: 12px 0 22px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-size: clamp(3.2rem, 13vw, 5rem);
      font-weight: 650;
      letter-spacing: -.055em;
      line-height: 1.15;
    }

    .timer-inputs {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 8px 0 24px;
    }

    .input-group { text-align: center; }
    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: .8rem;
    }

    input {
      width: 92px;
      padding: 12px 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: #111520;
      color: var(--text);
      text-align: center;
      font: inherit;
      font-size: 1.5rem;
    }

    input:focus { border-color: var(--accent); }
    input:disabled { opacity: .6; }
    .colon { padding-top: 24px; color: var(--muted); font-size: 1.5rem; }

    .presets {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 0 0 22px;
    }

    .preset, .secondary {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #202636;
      color: #cbd2e0;
      font-size: .88rem;
    }

    .preset:hover, .secondary:hover { background: #2a3144; }

    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .primary {
      min-width: 150px;
      padding: 13px 22px;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      transition: transform .15s, background .15s;
    }

    .primary:hover { background: #7969f2; transform: translateY(-1px); }
    .secondary { border-radius: 12px; }
    button:focus-visible { outline: 2px solid var(--accent-light); outline-offset: 3px; }

    .status {
      min-height: 1.4em;
      margin: 14px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: .9rem;
    }

    .laps {
      max-height: 210px;
      overflow: auto;
      margin-top: 20px;
      border-top: 1px solid var(--border);
    }

    .lap {
      display: flex;
      justify-content: space-between;
      padding: 11px 4px;
      border-bottom: 1px solid var(--border);
      color: #dce1ec;
      font-variant-numeric: tabular-nums;
    }

    .lap span:first-child { color: var(--muted); }
    footer { margin-top: 16px; color: #788298; text-align: center; font-size: .8rem; }

    @media (max-width: 380px) {
      .view { padding-inline: 16px; }
      input { width: 78px; }
      .readout { font-size: 3rem; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">Focus your time</p>
      <h1>Timer & Stopwatch</h1>
      <p class="subtitle">時間をセットして、今日のペースを整えよう。</p>
    </header>

    <section class="panel" aria-label="タイマーとストップウォッチ">
      <div class="tabs" role="tablist" aria-label="モード">
        <button class="tab" id="timer-tab" role="tab" aria-selected="true" aria-controls="timer-view">タイマー</button>
        <button class="tab" id="stopwatch-tab" role="tab" aria-selected="false" aria-controls="stopwatch-view">ストップウォッチ</button>
      </div>

      <section class="view" id="timer-view" role="tabpanel" aria-labelledby="timer-tab">
        <div class="timer-inputs">
          <div class="input-group">
            <label for="minutes">分</label>
            <input id="minutes" type="number" min="0" max="999" value="5" inputmode="numeric">
          </div>
          <span class="colon" aria-hidden="true">:</span>
          <div class="input-group">
            <label for="seconds">秒</label>
            <input id="seconds" type="number" min="0" max="59" value="00" inputmode="numeric">
          </div>
        </div>

        <div class="presets" aria-label="時間のプリセット">
          <button class="preset" data-seconds="60">1分</button>
          <button class="preset" data-seconds="300">5分</button>
          <button class="preset" data-seconds="600">10分</button>
          <button class="preset" data-seconds="1500">25分</button>
        </div>

        <div class="actions">
          <button class="primary" id="timer-start">スタート</button>
          <button class="secondary" id="timer-reset">リセット</button>
        </div>
        <p class="status" id="timer-status" aria-live="polite">時間を設定してください</p>
      </section>

      <section class="view" id="stopwatch-view" role="tabpanel" aria-labelledby="stopwatch-tab" hidden>
        <div class="readout" id="stopwatch-display" aria-live="off">00:00.00</div>
        <div class="actions">
          <button class="primary" id="stopwatch-start">スタート</button>
          <button class="secondary" id="lap-button" disabled>ラップ</button>
          <button class="secondary" id="stopwatch-reset">リセット</button>
        </div>
        <div class="laps" id="laps" aria-label="ラップ記録" aria-live="polite"></div>
      </section>
    </section>

    <footer>ブラウザーを閉じると計測はリセットされます。</footer>
  </main>

  <script>
    const timerTab = document.querySelector("#timer-tab");
    const stopwatchTab = document.querySelector("#stopwatch-tab");
    const timerView = document.querySelector("#timer-view");
    const stopwatchView = document.querySelector("#stopwatch-view");

    function showView(name) {
      const isTimer = name === "timer";
      timerView.hidden = !isTimer;
      stopwatchView.hidden = isTimer;
      timerTab.setAttribute("aria-selected", String(isTimer));
      stopwatchTab.setAttribute("aria-selected", String(!isTimer));
    }

    timerTab.addEventListener("click", () => showView("timer"));
    stopwatchTab.addEventListener("click", () => showView("stopwatch"));

    // Timer
    const minutesInput = document.querySelector("#minutes");
    const secondsInput = document.querySelector("#seconds");
    const timerStart = document.querySelector("#timer-start");
    const timerReset = document.querySelector("#timer-reset");
    const timerStatus = document.querySelector("#timer-status");

    let timerInterval = null;
    let timerEndAt = 0;
    let remainingMs = 0;

    function formatTimer(ms) {
      const totalSeconds = Math.ceil(Math.max(0, ms) / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    function setTimerInputs(totalSeconds) {
      minutesInput.value = Math.floor(totalSeconds / 60);
      secondsInput.value = totalSeconds % 60;
      remainingMs = totalSeconds * 1000;
    }

    function updateTimer() {
      remainingMs = Math.max(0, timerEndAt - Date.now());
      timerStatus.textContent = formatTimer(remainingMs);

      if (remainingMs <= 0) {
        clearInterval(timerInterval);
        timerInterval = null;
        timerStart.textContent = "スタート";
        minutesInput.disabled = false;
        secondsInput.disabled = false;
        timerStatus.textContent = "時間になりました！";
        beep();
      }
    }

    timerStart.addEventListener("click", () => {
      if (timerInterval) {
        remainingMs = Math.max(0, timerEndAt - Date.now());
        clearInterval(timerInterval);
        timerInterval = null;
        timerStart.textContent = "再開";
        timerStatus.textContent = "一時停止中";
        return;
      }

      if (remainingMs <= 0) {
        const mins = Math.max(0, Number(minutesInput.value) || 0);
        const secs = Math.min(59, Math.max(0, Number(secondsInput.value) || 0));
        remainingMs = (mins * 60 + secs) * 1000;
      }
      if (remainingMs <= 0) {
        timerStatus.textContent = "1秒以上の時間を設定してください";
        return;
      }

      minutesInput.disabled = true;
      secondsInput.disabled = true;
      timerEndAt = Date.now() + remainingMs;
      timerStart.textContent = "一時停止";
      timerStatus.textContent = formatTimer(remainingMs);
      timerInterval = setInterval(updateTimer, 100);
    });

    timerReset.addEventListener("click", () => {
      clearInterval(timerInterval);
      timerInterval = null;
      minutesInput.disabled = false;
      secondsInput.disabled = false;
      const mins = Math.max(0, Number(minutesInput.value) || 0);
      const secs = Math.min(59, Math.max(0, Number(secondsInput.value) || 0));
      remainingMs = (mins * 60 + secs) * 1000;
      timerStart.textContent = "スタート";
      timerStatus.textContent = remainingMs > 0 ? formatTimer(remainingMs) : "時間を設定してください";
    });

    document.querySelectorAll(".preset").forEach((button) => {
      button.addEventListener("click", () => {
        clearInterval(timerInterval);
        timerInterval = null;
        minutesInput.disabled = false;
        secondsInput.disabled = false;
        setTimerInputs(Number(button.dataset.seconds));
        timerStart.textContent = "スタート";
        timerStatus.textContent = formatTimer(remainingMs);
      });
    });

    [minutesInput, secondsInput].forEach((input) => {
      input.addEventListener("input", () => {
        const mins = Math.max(0, Number(minutesInput.value) || 0);
        const secs = Math.min(59, Math.max(0, Number(secondsInput.value) || 0));
        remainingMs = (mins * 60 + secs) * 1000;
        timerStatus.textContent = remainingMs > 0 ? formatTimer(remainingMs) : "時間を設定してください";
      });
    });

    function beep() {
      try {
        const audio = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audio.createOscillator();
        const gain = audio.createGain();
        oscillator.type = "sine";
        oscillator.frequency.value = 880;
        gain.gain.value = 0.15;
        oscillator.connect(gain);
        gain.connect(audio.destination);
        oscillator.start();
        oscillator.stop(audio.currentTime + 0.5);
        oscillator.onended = () => audio.close();
      } catch {
        // 音声が利用できない環境では、画面の通知だけを表示します。
      }
    }

    // Stopwatch
    const stopwatchDisplay = document.querySelector("#stopwatch-display");
    const stopwatchStart = document.querySelector("#stopwatch-start");
    const stopwatchReset = document.querySelector("#stopwatch-reset");
    const lapButton = document.querySelector("#lap-button");
    const lapsContainer = document.querySelector("#laps");

    let stopwatchInterval = null;
    let elapsedBeforeStart = 0;
    let stopwatchStartedAt = 0;
    let lapCount = 0;

    function formatStopwatch(ms) {
      const centiseconds = Math.floor(ms / 10);
      const minutes = Math.floor(centiseconds / 6000);
      const seconds = Math.floor((centiseconds % 6000) / 100);
      const fraction = centiseconds % 100;
      return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}.${String(fraction).padStart(2, "0")}`;
    }

    function updateStopwatch() {
      stopwatchDisplay.textContent = formatStopwatch(
        elapsedBeforeStart + performance.now() - stopwatchStartedAt
      );
    }

    stopwatchStart.addEventListener("click", () => {
      if (stopwatchInterval) {
        elapsedBeforeStart += performance.now() - stopwatchStartedAt;
        clearInterval(stopwatchInterval);
        stopwatchInterval = null;
        stopwatchStart.textContent = "再開";
        lapButton.disabled = true;
        updateStopwatch();
      } else {
        stopwatchStartedAt = performance.now();
        stopwatchInterval = setInterval(updateStopwatch, 20);
        stopwatchStart.textContent = "一時停止";
        lapButton.disabled = false;
      }
    });

    lapButton.addEventListener("click", () => {
      if (!stopwatchInterval) return;
      lapCount += 1;
      const current = elapsedBeforeStart + performance.now() - stopwatchStartedAt;
      const row = document.createElement("div");
      row.className = "lap";
      row.innerHTML = `<span>ラップ ${lapCount}</span><span>${formatStopwatch(current)}</span>`;
      lapsContainer.prepend(row);
    });

    stopwatchReset.addEventListener("click", () => {
      clearInterval(stopwatchInterval);
      stopwatchInterval = null;
      elapsedBeforeStart = 0;
      lapCount = 0;
      stopwatchDisplay.textContent = "00:00.00";
      stopwatchStart.textContent = "スタート";
      lapButton.disabled = true;
      lapsContainer.replaceChildren();
    });

    // 初期表示
    remainingMs = 5 * 60 * 1000;
    timerStatus.textContent = formatTimer(remainingMs);
  </script>
</body>
</html>
