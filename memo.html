<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ながいメモ</title>
  <style>
    :root {
      --bg: #f5f4f0;
      --paper: #fffefa;
      --text: #292a27;
      --muted: #85857e;
      --line: #e8e6df;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    }

    header {
      height: 64px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
    }

    .brand {
      font-size: 15px;
      font-weight: 700;
    }

    .actions,
    .color-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .color-control { font-size: 13px; }

    #text-color {
      width: 38px;
      height: 38px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      cursor: pointer;
    }

    button {
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    main {
      width: min(820px, calc(100% - 32px));
      min-height: calc(100vh - 64px);
      margin: 32px auto;
      padding: 48px 64px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
    }

    .save-status {
      min-height: 20px;
      color: var(--muted);
      font-size: 12px;
    }

    #title {
      width: 100%;
      margin: 22px 0 18px;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: clamp(26px, 5vw, 36px);
      font-weight: 700;
    }

    #body {
      width: 100%;
      min-height: 60vh;
      border: 0;
      outline: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 16px;
      line-height: 2;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #body:empty::before {
      content: attr(data-placeholder);
      color: #b6b4ac;
      pointer-events: none;
    }

    footer {
      display: flex;
      justify-content: space-between;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 600px) {
      header {
        height: auto;
        min-height: 58px;
        padding: 10px 16px;
      }

      main {
        width: 100%;
        min-height: calc(100vh - 58px);
        margin: 0;
        padding: 32px 22px;
        border: 0;
        border-radius: 0;
      }

      .color-control span { display: none; }
      button { padding: 8px 10px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">ながいメモ</div>
    <div class="actions">
      <label class="color-control" for="text-color">
        <span>文字色</span>
        <input id="text-color" type="color" value="#292a27" aria-label="文字色">
      </label>
      <button id="download" type="button">書き出す</button>
      <button id="clear" type="button">新しくする</button>
    </div>
  </header>

  <main>
    <div class="save-status" id="status" aria-live="polite">
      この端末に保存されます
    </div>

    <input id="title" type="text" placeholder="タイトル" aria-label="メモのタイトル">

    <div
      id="body"
      contenteditable="true"
      role="textbox"
      aria-multiline="true"
      aria-label="メモの本文"
      data-placeholder="ここから書き始めましょう…"
    ></div>

    <footer>
      <span id="counts">0文字</span>
      <span>自動保存 · Ctrl / ⌘ + S で保存</span>
    </footer>
  </main>

  <script>
    const STORAGE_KEY = "nagai-memo-v1";
    const titleInput = document.getElementById("title");
    const bodyInput = document.getElementById("body");
    const textColorInput = document.getElementById("text-color");
    const status = document.getElementById("status");
    const counts = document.getElementById("counts");
    let saveTimer;
    let savedRange = null;

    function getBodyText() {
      return bodyInput.innerText.replace(/\n$/, "");
    }

    function updateCounts() {
      const text = getBodyText();
      counts.textContent = `${[...text].length.toLocaleString()}文字`;
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          title: titleInput.value,
          body: bodyInput.innerHTML,
          textColor: textColorInput.value
        }));
        status.textContent = "保存しました";
      } catch {
        status.textContent = "保存できませんでした";
      }
    }

    function scheduleSave() {
      status.textContent = "保存中…";
      updateCounts();

      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 500);
    }

    function rememberSelection() {
      const selection = window.getSelection();

      if (
        selection &&
        selection.rangeCount &&
        !selection.isCollapsed &&
        bodyInput.contains(selection.anchorNode) &&
        bodyInput.contains(selection.focusNode)
      ) {
        savedRange = selection.getRangeAt(0).cloneRange();
      }
    }

    function changeTextColor(color) {
      document.documentElement.style.setProperty("--text", color);

      if (savedRange) {
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(savedRange);

        document.execCommand("foreColor", false, color);
        savedRange = null;
      }

      scheduleSave();
    }

    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");

      if (saved) {
        titleInput.value = saved.title || "";
        bodyInput.innerHTML = saved.body || "";
        textColorInput.value = saved.textColor || "#292a27";
        document.documentElement.style.setProperty(
          "--text",
          textColorInput.value
        );
      }
    } catch {
      status.textContent = "保存データを読み込めませんでした";
    }

    updateCounts();

    titleInput.addEventListener("input", scheduleSave);
    bodyInput.addEventListener("input", scheduleSave);
    bodyInput.addEventListener("mouseup", rememberSelection);
    bodyInput.addEventListener("keyup", rememberSelection);
    document.addEventListener("selectionchange", rememberSelection);

    textColorInput.addEventListener("input", () => {
      changeTextColor(textColorInput.value);
    });

    document.addEventListener("keydown", event => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
        event.preventDefault();
        clearTimeout(saveTimer);
        save();
      }
    });

    document.getElementById("download").addEventListener("click", () => {
      const text =
        `${titleInput.value || "無題のメモ"}\n\n${getBodyText()}`;

      const blob = new Blob([text], {
        type: "text/plain;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download =
        `${(titleInput.value || "メモ").replace(/[\\/:*?"<>|]/g, "_")}.txt`;

      link.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("clear").addEventListener("click", () => {
      if (!confirm("今のメモを消して、新しいメモを始めますか？")) return;

      titleInput.value = "";
      bodyInput.innerHTML = "";
      savedRange = null;
      updateCounts();
      save();
      titleInput.focus();
    });
  </script>
</body>
</html>
