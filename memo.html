<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ながいメモ</title>
  <link rel="icon" href="mansyuboal-_1_.ico">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f4f0;
      --paper: #fffefa;
      --text: #292a27;
      --muted: #85857e;
      --line: #e8e6df;
      --accent: #527a68;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    }

    header {
      height: 64px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
    }

    .brand {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .brand span { color: var(--accent); }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    button:hover { background: #f5f4f0; }

    main {
      width: min(820px, calc(100% - 32px));
      min-height: calc(100vh - 64px);
      margin: 32px auto;
      padding: 48px 64px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      box-shadow: 0 8px 30px rgb(40 40 30 / 4%);
    }

    .save-status {
      min-height: 20px;
      color: var(--muted);
      font-size: 12px;
    }

    #title {
      width: 100%;
      margin: 22px 0 18px;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: clamp(26px, 5vw, 36px);
      font-weight: 700;
    }

    #title::placeholder { color: #c4c2ba; }

    #body {
      width: 100%;
      min-height: 60vh;
      resize: vertical;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 16px;
      line-height: 2;
      overflow-wrap: anywhere;
    }

    #body::placeholder { color: #b6b4ac; }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 600px) {
      header { height: 58px; padding: 0 16px; }
      main {
        width: 100%;
        min-height: calc(100vh - 58px);
        margin: 0;
        padding: 32px 22px;
        border: 0;
        border-radius: 0;
      }
      #body { min-height: 65vh; }
      .actions { gap: 6px; }
      button { padding: 8px 10px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span>●</span> ながいメモ</div>
    <div class="actions">
      <button id="download" type="button">テキストを書き出す</button>
      <button id="clear" type="button">新しくする</button>
    </div>
  </header>

  <main>
    <div class="save-status" id="status" aria-live="polite">この端末に保存されます</div>
    <input id="title" type="text" placeholder="タイトル" aria-label="メモのタイトル">
    <textarea id="body" placeholder="ここから書き始めましょう…" aria-label="メモの本文"></textarea>
    <footer>
      <span id="counts">0文字</span>
      <span>自動保存 · Ctrl / ⌘ + S で保存</span>
    </footer>
  </main>

  <script>
    const STORAGE_KEY = "nagai-memo-v1";
    const titleInput = document.getElementById("title");
    const bodyInput = document.getElementById("body");
    const status = document.getElementById("status");
    const counts = document.getElementById("counts");
    let saveTimer;

    function updateCounts() {
      const text = bodyInput.value;
      const characters = [...text].length;
      const words = text.trim()
        ? (typeof Intl.Segmenter === "function"
          ? [...new Intl.Segmenter("ja", { granularity: "word" }).segment(text)]
              .filter(part => part.isWordLike).length
          : text.trim().split(/\s+/).length)
        : 0;

      counts.textContent = `${characters.toLocaleString()}文字 · ${words.toLocaleString()}語`;
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          title: titleInput.value,
          body: bodyInput.value
        }));
        status.textContent = `保存しました · ${new Date().toLocaleTimeString("ja-JP", {
          hour: "2-digit",
          minute: "2-digit"
        })}`;
      } catch {
        status.textContent = "保存できませんでした。ブラウザーの設定をご確認ください";
      }
    }

    function scheduleSave() {
      status.textContent = "保存中…";
      updateCounts();
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 500);
    }

    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      if (saved) {
        titleInput.value = saved.title || "";
        bodyInput.value = saved.body || "";
      }
    } catch {
      status.textContent = "保存データを読み込めませんでした";
    }
    updateCounts();

    titleInput.addEventListener("input", scheduleSave);
    bodyInput.addEventListener("input", scheduleSave);

    document.addEventListener("keydown", event => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
        event.preventDefault();
        clearTimeout(saveTimer);
        save();
      }
    });

    document.getElementById("download").addEventListener("click", () => {
      const text = `${titleInput.value || "無題のメモ"}\n\n${bodyInput.value}`;
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `${(titleInput.value || "メモ").replace(/[\\/:*?"<>|]/g, "_")}.txt`;
      link.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("clear").addEventListener("click", () => {
      if (!confirm("今のメモを消して、新しいメモを始めますか？")) return;
      titleInput.value = "";
      bodyInput.value = "";
      updateCounts();
      save();
      titleInput.focus();
    });
  </script>
</body>
</html>
