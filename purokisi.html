<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>簡易プロキシビューアー</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }
        .controls {
            margin-bottom: 15px;
        }
        input[type="text"] {
            width: 400px;
            padding: 5px;
        }
        button {
            padding: 6px 12px;
        }
        /* 表示枠を大きく見やすくする */
        #proxyFrame {
            width: 100%;
            height: 600px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h2>Webプロキシビューアー</h2>
    <div class="controls">
        <input type="text" id="targetUrl" placeholder="https://example.com" value="https://example.com">
        <button onclick="loadProxy()">アクセスする</button>
    </div>
    
    <!-- divの代わりにiframeを使うことでCSSやレイアウトを保持しやすくする -->
    <iframe id="proxyFrame" src="about:blank"></iframe>

    <script>
        function loadProxy() {
            let url = document.getElementById('targetUrl').value;
            if (!url) return;

            // URLに http:// がついていない場合は補完する
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
                document.getElementById('targetUrl').value = url;
            }

            // alloriginsの /raw エンドポイントは、取得したコンテンツをそのままHTMLとして返します
            const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);

            // iframeのsrcに直接プロキシURLを指定する
            document.getElementById('proxyFrame').src = proxyUrl;
        }
    </script>
</body>
</html>
