<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カスタムルーレット</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
            color: var(--primary);
        }

        .roulette-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px auto;
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 24px solid #ef4444;
            z-index: 10;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 2px 5px rgba(79, 70, 229, 0.3);
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
            box-shadow: none;
        }

        .input-section {
            margin-top: 25px;
            text-align: left;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .item-list {
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            list-style: none;
            margin: 0 0 15px 0;
            background: #fbfcfe;
        }

        .item-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
        }

        .item-list li:last-child {
            border-bottom: none;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
            box-shadow: none;
        }
        .delete-btn:hover {
            background: none;
            color: #dc2626;
        }

        #result {
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
            min-height: 30px;
            color: #0f172a;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>カスタムルーレット</h1>
    
    <div class="roulette-wrapper">
        <div class="pointer"></div>
        <canvas id="rouletteCanvas" width="400" height="400"></canvas>
    </div>

    <div id="result"></div>
    <button id="spinBtn" onclick="spinRoulette()">まわす！</button>

    <div class="input-section">
        <label style="font-size: 14px; font-weight: bold; display: block; margin-bottom: 5px;">項目を追加・編集</label>
        <div class="input-group">
            <input type="text" id="itemInput" placeholder="例: ラーメン、カレー、寿司..." onkeypress="handleKeyPress(event)">
            <button onclick="addItem()" style="padding: 10px 16px; font-size: 14px;">追加</button>
        </div>
        <ul id="itemList" class="item-list"></ul>
        <button onclick="resetDefault()" style="background-color: #64748b; font-size: 13px; padding: 6px 12px; width: 100%;">初期に戻す</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('rouletteCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const resultDiv = document.getElementById('result');
    const itemInput = document.getElementById('itemInput');
    const itemListEl = document.getElementById('itemList');

    // デフォルトの項目
    const defaultItems = ['寿司', '焼肉', 'ラーメン', 'カレー', 'オムライス', 'うどん'];
    let items = [];

    // カラーパレット
    const colors = ['#6366f1', '#ec4899', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#14b8a6', '#f43f5e'];

    let currentAngle = 0; // 現在の回転角
    let isSpinning = false;

    // ローカルストレージから読み込み
    function loadItems() {
        const saved = localStorage.getItem('custom_roulette_items');
        if (saved) {
            try {
                items = JSON.parse(saved);
            } catch (e) {
                items = [...defaultItems];
            }
        } else {
            items = [...defaultItems];
        }
        if (items.length === 0) {
            items = ['項目なし'];
        }
        updateUI();
    }

    // ローカルストレージに保存
    function saveItems() {
        localStorage.setItem('custom_roulette_items', JSON.stringify(items));
    }

    // 画面の更新（リスト描画とルーレット描画）
    function updateUI() {
        // リスト描画
        itemListEl.innerHTML = '';
        items.forEach((item, index) => {
            const li = document.createElement('li');
            li.innerHTML = `<span>${escapeHtml(item)}</span> <button class="delete-btn" onclick="removeItem(${index})">&times;</button>`;
            itemListEl.appendChild(li);
        });
        drawRoulette();
    }

    // ルーレットを描画
    function drawRoulette() {
        const total = items.length;
        const arc = (2 * Math.PI) / total;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = canvas.width / 2 - 10;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < total; i++) {
            const angle = currentAngle + i * arc;
            
            // セクター（扇形）の描画
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, angle, angle + arc);
            ctx.closePath();
            ctx.fillStyle = colors[i % colors.length];
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // テキストの描画
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(angle + arc / 2);
            ctx.textAlign = 'right';
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px sans-serif';
            ctx.fillText(items[i], radius - 20, 6);
            ctx.restore();
        }
    }

    // 項目追加
    function addItem() {
        const text = itemInput.value.trim();
        if (!text) return;
        items.push(text);
        itemInput.value = '';
        saveItems();
        updateUI();
        resultDiv.textContent = '';
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            addItem();
        }
    }

    // 項目削除
    function removeItem(index) {
        if (items.length <= 1) {
            alert('最低1つの項目が必要です。');
            return;
        }
        items.splice(index, 1);
        saveItems();
        updateUI();
        resultDiv.textContent = '';
    }

    // 初期化
    function resetDefault() {
        if (confirm('初期の項目に戻しますか？')) {
            items = [...defaultItems];
            saveItems();
            updateUI();
            resultDiv.textContent = '';
        }
    }

    // ルーレットを回すアニメーション
    function spinRoulette() {
        if (isSpinning) return;
        if (items.length === 0) return;

        isSpinning = true;
        spinBtn.disabled = true;
        resultDiv.textContent = 'まわってます...';

        const total = items.length;
        const arc = (2 * Math.PI) / total;

        // ランダムな回転数（5〜8回転）＋ランダムなオフセット
        const extraRotations = (5 + Math.floor(Math.random() * 4)) * 2 * Math.PI;
        const randomAngle = Math.random() * 2 * Math.PI;
        const targetAngle = currentAngle + extraRotations + randomAngle;

        const duration = 3000; // 3秒
        const startTime = performance.now();
        const startAngle = currentAngle;

        function animate(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);

            // イージング関数（だんだん減速する）
            const easeOut = 1 - Math.pow(1 - progress, 3);

            currentAngle = startAngle + (targetAngle - startAngle) * easeOut;
            drawRoulette();

            if (progress < 1) {
                requestAnimationFrame(animate);
            } else {
                isSpinning = false;
                spinBtn.disabled = false;

                // 停止位置の計算（真上がポインターなので調整）
                // 正規化 (0〜2π)
                const normalizedAngle = (2 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
                // ポインターの位置（真上 = -PI/2 または 270度方向）に合わせた計算
                const pointerOffset = (1.5 * Math.PI) % (2 * Math.PI);
                const winningIndex = Math.floor(((normalizedAngle + pointerOffset) % (2 * Math.PI)) / arc) % total;

                resultDiv.textContent = `結果: ${items[winningIndex]} 🎉`;
            }
        }

        requestAnimationFrame(animate);
    }

    function escapeHtml(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }

    // 初回ロード
    loadItems();
</script>

</body>
</html>
